<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Looper Golf</title>
  <meta name="description" content="Download Looper Golf on the App Store." />
  <!--
    Deliberately excluded from Universal Links in the AASA file
    ({"/":"/install","exclude":true}) — always a plain web page, never
    intercepted by the app even when installed. Static, no JS needed.
  -->
  <meta name="apple-itunes-app" content="app-id=6759972833" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal:       #00C9A7;
      --teal-dark:  #00A88C;
      --green-deep: #0D3B2E;
      --bg:         #F7FFFE;
      --text:       #1A2E29;
      --muted:      #5A7A72;
      --border:     #D0EDE8;
      --white:      #FFFFFF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
    }
    .wordmark { font-size: 1.1rem; font-weight: 800; color: var(--green-deep); letter-spacing: -0.3px; margin-bottom: 24px; }
    .wordmark span { color: var(--teal-dark); }
    h1 { font-size: 1.4rem; font-weight: 700; color: var(--green-deep); margin-bottom: 10px; }
    p.sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }
    .appstore-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: #000; color: #fff; text-decoration: none; border-radius: 14px;
      padding: 11px 22px; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.1px;
      border: 1.5px solid rgba(255,255,255,0.15);
      transition: background 0.2s, transform 0.15s;
    }
    .appstore-btn:hover { background: #1a1a1a; transform: translateY(-1px); }
    .appstore-btn-text { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
    .appstore-btn-text span:first-child { font-size: 0.68rem; font-weight: 400; opacity: 0.85; letter-spacing: 0.3px; }
    .appstore-btn-text span:last-child  { font-size: 1rem; font-weight: 700; }
    .home-link { display: block; margin-top: 24px; font-size: 0.85rem; color: var(--muted); text-decoration: none; }
    .home-link:hover { color: var(--teal-dark); }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark">Looper<span>Golf</span></div>
    <h1>Get Looper Golf</h1>
    <p class="sub">Your AI coach, caddie, and analyst — in your pocket, on every hole.</p>
    <a class="appstore-btn" href="https://apps.apple.com/us/app/looper-golf/id6759972833" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 814 1000" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-37.3-155.5-127.4C46.5 790.9 0 686.7 0 586.3c0-168.6 110.2-257.9 218.7-257.9 77.7 0 142.1 51.4 189.6 51.4 45.5 0 117.3-54.4 207.2-54.4zm-120.3-174.1c37.5-45.2 64.4-107.9 64.4-170.6 0-8.9-.6-17.9-2.2-25.5-61 2.2-134.7 40.8-178.3 91.1-35.3 40.8-69.3 103.5-69.3 167.2 0 9.5 1.6 19.1 2.2 22.3 3.8.6 9.5 1.3 15.2 1.3 55.4 0 125.1-37.5 167.9-85.8z"/>
      </svg>
      <span class="appstore-btn-text">
        <span>Download on the</span>
        <span>App Store</span>
      </span>
    </a>
    <a class="home-link" href="/">Learn more at looper.golf</a>
  </div>
</body>
</html>
